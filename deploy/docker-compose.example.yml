# Copier vers docker-compose.yml et ajuster les chemins montés.
#
# Les CLIs agents ne sont pas dans l'image : installez ceux dont vous vous servez
# depuis l'interface, au premier écran de nouvelle conversation. Ils atterrissent
# dans le volume de données, donc ils survivent au remplacement du conteneur.
#
# Reste à les authentifier : montez les répertoires de credentials depuis l'hôte
# (authentifiez-vous une fois sur l'hôte avec `claude` / `codex login` /
# `opencode auth login`), ou faites-le
# dans le conteneur via `docker exec`.
#
# Premier compte (administrateur d'office) :
#   docker compose exec -it solera node /app/server/cli/user-create.js
#
# Mise à jour : changer le tag de l'image puis `docker compose up -d --pull always`.

services:
  solera:
    image: ghcr.io/tipaq/solera:latest
    container_name: solera
    restart: unless-stopped
    ports:
      # Le serveur ne gère pas TLS : n'exposez ce port qu'en local ou derrière
      # un reverse proxy / VPN, jamais directement sur Internet.
      - "127.0.0.1:7517:7517"
    volumes:
      # Base, pièces jointes, worktrees, logs, et les CLIs agents installés depuis
      # l'interface. Volume obligatoire : sans lui, les CLIs seraient à réinstaller
      # à chaque remplacement du conteneur.
      - solera-data:/home/node/.local/share/solera
      # Config optionnelle (config.toml).
      - solera-config:/home/node/.config/solera
      # Credentials des CLIs agents, partagés avec l'hôte.
      - ~/.claude:/home/node/.claude
      - ~/.codex:/home/node/.codex
      # OpenCode y garde ses identifiants et ses sessions : sans ce volume, une
      # conversation ne se reprendrait pas après le remplacement du conteneur.
      - ~/.local/share/opencode:/home/node/.local/share/opencode
      # Vos dépôts : les projets créés dans Solera pointent sur ces chemins.
      - ~/projects:/home/node/workspace

volumes:
  solera-data:
  solera-config:
