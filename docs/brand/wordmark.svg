<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 72" width="340" height="72" role="img" aria-label="Solera">
  <!--
    En-tête du dépôt. Rendu par GitHub comme une image, donc sans accès aux jetons du
    thème : les deux modes sont portés par une requête de préférence, que le navigateur
    évalue même à l'intérieur d'un SVG chargé en `<img>`.

    Le texte reste du texte, pas des tracés : la pile de polices système suffit ici, et
    vectoriser le mot le figerait sans rien apporter.
  -->
  <style>
    :root { --mark: #436e69; --word: #181d37; --sub: #797f99; }
    @media (prefers-color-scheme: dark) {
      :root { --mark: #a6d8cc; --word: #eceaf7; --sub: #9a97b5; }
    }
    .word {
      font-family: ui-sans-serif, system-ui, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 30px;
      font-weight: 650;
      letter-spacing: -0.6px;
      fill: var(--word);
    }
    .sub {
      font-family: ui-sans-serif, system-ui, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 13px;
      fill: var(--sub);
    }
  </style>

  <g transform="translate(4 12) scale(.48)" fill="var(--mark)">
  <path d="M70 19.36A40 40 0 1 1 30 19.36L37 31.48A26 26 0 1 0 63 31.48Z" />
  <path d="M33 2H67L50 26Z" />
  </g>

  <text class="word" x="60" y="34">Solera</text>
  <text class="sub" x="61" y="54">Plateforme de développement agentique</text>
</svg>
