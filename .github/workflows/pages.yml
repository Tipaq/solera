name: Pages

# Déploie le site vitrine (dossier site/) sur GitHub Pages.
# Réglage requis une fois : Settings > Pages > Source = GitHub Actions.
#
# À CHANGER QUAND LE DÉPÔT PASSERA EN PUBLIC : le déclenchement automatique est
# désarmé. Sur un dépôt privé, Pages demande un compte Pro, donc ce workflow échouait
# à chaque push touchant le site — un échec permanent finit par masquer les vrais.
# Il reste lançable à la main. Pour le réarmer, décommenter le bloc `push` ci-dessous,
# et activer Settings > Pages > Source = GitHub Actions.
#
# Ne pas réarmer avant d'avoir ouvert le dépôt : le site publie des commandes
# d'installation qui tirent install.sh depuis raw.githubusercontent.com, lequel répond
# 404 tant que le dépôt est privé. Un site en ligne qui n'installe rien est pire que
# pas de site.

on:
  # push:
  #   branches: [main]
  #   paths: ['site/**', 'install.sh', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # L'installeur est aussi servi depuis le site : l'URL courte
      # tipaq.github.io/solera/install.sh reste valable.
      - run: cp install.sh site/install.sh
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
