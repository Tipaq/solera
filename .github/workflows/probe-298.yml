name: probe-298
# Temporaire (carte #298) : la sonde de actions-ui-check, sur plusieurs machines. Retiré avant la PR.
on:
  push:
    branches: [fix/298-actions-ui-check]
env:
  ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
jobs:
  probe:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        n: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: |
          mkdir -p /tmp/shots
          for i in 1 2; do ACTIONS_SHOTS=/tmp/shots node scripts/_probe298.mjs || echo "PROBE FAILED run $i"; done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shots-${{ matrix.n }}
          path: /tmp/shots/FAIL.png
          if-no-files-found: ignore
